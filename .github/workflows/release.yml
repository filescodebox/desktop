name: Release Desktop

# desktop-v* tag → 三平台构建安装包 → 本仓 Release + 跨仓回挂 filescodebox/filescodebox
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
      - name: Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: 构建并发布（tauri-action：产物进本仓 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FilesCodeBox Desktop ${{ github.ref_name }}"
          releaseBody: "三平台桌面客户端安装包。连接你的 FilesCodeBox 服务器即可使用。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 最终产物回挂生态主仓（产物放 filescodebox/filescodebox Releases）。
  # 跨仓操作 GITHUB_TOKEN 无权限，需在仓库 Secrets 配 DESKTOP_PAT（hub 仓写权限的 PAT）；
  # 未配置时本 job 允许失败（continue-on-error），回挂由本地 `gh release upload` 完成。
  publish-to-hub:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: 回挂产物到生态主仓
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sleep 30
          gh release view "$TAG" --repo filescodebox/filescodebox >/dev/null 2>&1 || \
            gh release create "$TAG" --repo filescodebox/filescodebox \
              --title "FilesCodeBox Desktop $TAG" \
              --notes "桌面客户端安装包（见 Assets）。服务器部署见主 README。"
          mkdir -p /tmp/assets
          gh release download "$TAG" --repo filescodebox/filescodebox-desktop --dir /tmp/assets --clobber || true
          for f in /tmp/assets/*; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --repo filescodebox/filescodebox --clobber || true
          done
          echo "已回挂到 filescodebox/filescodebox Releases"

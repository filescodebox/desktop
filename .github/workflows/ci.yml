name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Linux 依赖(Tauri webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      # tauri-build 校验 externalBin 存在(sidecar 不入库),CI 与发版同源下载
      - name: 下载 p2pc sidecar(钉版)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P2PC_REF=$(grep -E '^P2PC_REF=' DEPS.env 2>/dev/null | cut -d= -f2 || true)
          [ -n "$P2PC_REF" ] || P2PC_REF=$(gh release view -R pigeonbox/p2p --json tagName --jq .tagName)
          mkdir -p src-tauri/binaries
          gh release download "$P2PC_REF" --repo pigeonbox/p2p \
            --pattern "p2pc-x86_64-unknown-linux-gnu*" --dir src-tauri/binaries --clobber
          chmod +x src-tauri/binaries/p2pc-* 2>/dev/null || true
      # 编译门禁：此前仓内无任何 CI 检查，编译回归要到发版打包才暴露
      # Cargo.toml 在 src-tauri/ 子目录，cargo 全程带 manifest-path
      - name: cargo check
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml
      - name: cargo test
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml
      # 告警先观察，收敛为 0 后再加 -D warnings 升门禁
      - name: cargo clippy
        run: cargo clippy --workspace --manifest-path src-tauri/Cargo.toml
